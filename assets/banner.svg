<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0b14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <!-- Accent Glow Gradients -->
    <radialGradient id="glowViolet" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowCyan" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowRose" cx="60%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0"/>
    </radialGradient>

    <!-- Text Title Gradient -->
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#f8fafc"/>
      <stop offset="70%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- Badge Border Gradients -->
    <linearGradient id="pillBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes floatFast {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-12px); }
      }
      @keyframes pulseBeam {
        0%, 100% { opacity: 0.25; transform: scale(1); }
        50% { opacity: 0.55; transform: scale(1.08); }
      }
      @keyframes waveBar {
        0%, 100% { height: 18px; y: 272px; }
        50% { height: 48px; y: 242px; }
      }
      @keyframes waveBar2 {
        0%, 100% { height: 35px; y: 255px; }
        50% { height: 12px; y: 278px; }
      }
      @keyframes streamPulse {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }

      .floating-pill-1 { animation: floatSlow 6s ease-in-out infinite; }
      .floating-pill-2 { animation: floatFast 7s ease-in-out infinite; }
      .floating-pill-3 { animation: floatSlow 8s ease-in-out infinite 1s; }
      .pulse-bg { animation: pulseBeam 9s ease-in-out infinite; transform-origin: center; }
      .bar-1 { animation: waveBar 1.8s ease-in-out infinite; }
      .bar-2 { animation: waveBar2 2.2s ease-in-out infinite; }
      .bar-3 { animation: waveBar 1.4s ease-in-out infinite 0.3s; }
      .bar-4 { animation: waveBar2 2.0s ease-in-out infinite 0.5s; }
      .bar-5 { animation: waveBar 1.6s ease-in-out infinite 0.2s; }
      .bar-6 { animation: waveBar2 2.4s ease-in-out infinite 0.4s; }
      .grid-line { stroke: #1e293b; stroke-opacity: 0.4; stroke-width: 1; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bgGradient)"/>

  <!-- Dynamic Ambient Lighting (in background layer) -->
  <circle cx="200" cy="90" r="260" fill="url(#glowViolet)" class="pulse-bg"/>
  <circle cx="1000" cy="270" r="280" fill="url(#glowCyan)" class="pulse-bg"/>
  <circle cx="720" cy="80" r="200" fill="url(#glowRose)" class="pulse-bg"/>

  <!-- Subtle Geometric Grid / Tech Mesh -->
  <g opacity="0.35">
    <line x1="0" y1="60" x2="1200" y2="60" class="grid-line" stroke-dasharray="4 8"/>
    <line x1="0" y1="120" x2="1200" y2="120" class="grid-line" stroke-dasharray="4 8"/>
    <line x1="0" y1="180" x2="1200" y2="180" class="grid-line" stroke-dasharray="4 8"/>
    <line x1="0" y1="240" x2="1200" y2="240" class="grid-line" stroke-dasharray="4 8"/>
    <line x1="0" y1="300" x2="1200" y2="300" class="grid-line" stroke-dasharray="4 8"/>
    
    <line x1="150" y1="0" x2="150" y2="360" class="grid-line" stroke-dasharray="4 8"/>
    <line x1="350" y1="0" x2="350" y2="360" class="grid-line" stroke-dasharray="4 8"/>
    <line x1="550" y1="0" x2="550" y2="360" class="grid-line" stroke-dasharray="4 8"/>
    <line x1="750" y1="0" x2="750" y2="360" class="grid-line" stroke-dasharray="4 8"/>
    <line x1="950" y1="0" x2="950" y2="360" class="grid-line" stroke-dasharray="4 8"/>
    <line x1="1100" y1="0" x2="1100" y2="360" class="grid-line" stroke-dasharray="4 8"/>
  </g>

  <!-- Dynamic Equalizer / Metric Activity Bars (Bottom Right Decorative) -->
  <g opacity="0.65" transform="translate(980, 0)">
    <rect x="0" y="270" width="8" height="20" rx="4" fill="#38bdf8" class="bar-1"/>
    <rect x="14" y="260" width="8" height="30" rx="4" fill="#60a5fa" class="bar-2"/>
    <rect x="28" y="250" width="8" height="40" rx="4" fill="#818cf8" class="bar-3"/>
    <rect x="42" y="265" width="8" height="25" rx="4" fill="#a78bfa" class="bar-4"/>
    <rect x="56" y="245" width="8" height="45" rx="4" fill="#c084fc" class="bar-5"/>
    <rect x="70" y="268" width="8" height="22" rx="4" fill="#f43f5e" class="bar-6"/>
  </g>

  <!-- Dynamic Connecting Data Stream Line -->
  <path d="M 60 300 Q 300 240 600 290 T 1140 260" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="10 14" style="animation: streamPulse 25s linear infinite;"/>

  <!-- Animated Floating Accent Badges (Placed discreetly at edges so text is NEVER hidden) -->
  <!-- Top Left Badge -->
  <g class="floating-pill-1" transform="translate(60, 42)">
    <rect width="145" height="32" rx="16" fill="#1e1b4b" fill-opacity="0.75" stroke="#6366f1" stroke-width="1.2"/>
    <circle cx="18" cy="16" r="5" fill="#22c55e"/>
    <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e0e7ff">▶ YouTube Ads</text>
  </g>

  <!-- Top Right Badge -->
  <g class="floating-pill-2" transform="translate(980, 46)">
    <rect width="160" height="32" rx="16" fill="#0f172a" fill-opacity="0.75" stroke="#38bdf8" stroke-width="1.2"/>
    <circle cx="18" cy="16" r="5" fill="#38bdf8"/>
    <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#bae6fd">⚡ Auto-Publishing</text>
  </g>

  <!-- Center Floating Pill Left -->
  <g class="floating-pill-3" transform="translate(70, 275)">
    <rect width="165" height="32" rx="16" fill="#18181b" fill-opacity="0.75" stroke="#ec4899" stroke-width="1.2"/>
    <circle cx="18" cy="16" r="5" fill="#ec4899"/>
    <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#fbcfe8">📈 Audience Growth</text>
  </g>

  <!-- ============================================================== -->
  <!-- FOREGROUND CONTENT: Header, Badges, Title & Subtitle (Z-INDEX TOP) -->
  <!-- ============================================================== -->

  <!-- Top Category Tag -->
  <g transform="translate(600, 78)">
    <rect x="-165" y="-14" width="330" height="28" rx="14" fill="#1e293b" fill-opacity="0.85" stroke="url(#pillBorder)" stroke-width="1.5" filter="url(#shadowFilter)"/>
    <text x="0" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#38bdf8">CURATED AWESOME ECOSYSTEM</text>
  </g>

  <!-- Main Hero Title -->
  <g transform="translate(600, 155)" filter="url(#shadowFilter)">
    <text x="0" y="0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-1" fill="url(#titleGradient)">Awesome Video Promotion Platform</text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(600, 198)" filter="url(#shadowFilter)">
    <text x="0" y="0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#cbd5e1">The Definitive Directory of Video Distribution, Audience Growth &amp; Social Syndication Platforms</text>
  </g>

  <!-- Sub-Tagline Features List -->
  <g transform="translate(600, 240)">
    <!-- Pill 1 -->
    <rect x="-240" y="-12" width="145" height="26" rx="13" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1"/>
    <text x="-167" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#94a3b8">💼 SaaS Platforms</text>

    <!-- Pill 2 -->
    <rect x="-80" y="-12" width="160" height="26" rx="13" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1"/>
    <text x="0" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#94a3b8">🔓 Open-Source Tools</text>

    <!-- Pill 3 -->
    <rect x="95" y="-12" width="145" height="26" rx="13" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1"/>
    <text x="167" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#94a3b8">🚀 Growth Pipelines</text>
  </g>

  <!-- Bottom Accent Border -->
  <rect x="0" y="356" width="1200" height="4" fill="url(#titleGradient)"/>
</svg>
